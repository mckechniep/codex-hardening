# First-pass network profile config.
# The wrapper and hook use this file today.
# Set `backend = "linux_wsl_nft"` only on WSL kernels that pass `codex-net doctor`.
# The planned stock-WSL replacement backend is `linux_wsl_netns`, but it is not ready for normal execution yet.

backend = "hook_only"
default_profile = "offline"
dns_mode = "system_resolver"
temporary_grant_ttl = "30m"

[backend_linux_wsl_nft]
scope_unit_prefix = "codex-net"
nft_table_name = "codex_hardening"
chain_name = "codex_net_output"
use_systemd_user = true

[backend_linux_wsl_netns]
namespace_prefix = "codex-net"
host_veth_prefix = "cnh"
guest_veth_prefix = "cng"
nft_table_name = "codex_netns_runtime"

[profiles.offline]
description = "No remote network access."
allow_localhost = true
allowed_domains = []
allowed_tcp_ports = []
allowed_udp_ports = []
require_approval = false

[profiles.registries]
description = "Common package registries and source hosts."
allow_localhost = true
allowed_domains = [
  "api.github.com",
  "files.pythonhosted.org",
  "github.com",
  "index.crates.io",
  "pypi.org",
  "raw.githubusercontent.com",
  "registry.npmjs.org",
]
allowed_tcp_ports = [443]
allowed_udp_ports = [53]
require_approval = true

[profiles.git_readonly]
description = "Read-only Git remote access."
allow_localhost = true
allowed_domains = [
  "api.github.com",
  "github.com",
]
allowed_tcp_ports = [22, 443]
allowed_udp_ports = [53]
require_approval = true

[profiles.dev_local]
description = "Loopback and common local development ports."
allow_localhost = true
allowed_domains = [
  "localhost",
  "127.0.0.1",
  "::1",
]
allowed_tcp_ports = [80, 3000, 4173, 5000, 8000, 8080]
allowed_udp_ports = []
require_approval = false

[profiles.custom]
description = "User-managed profile entries."
allow_localhost = true
allowed_domains = []
allowed_tcp_ports = []
allowed_udp_ports = []
require_approval = true

[tool_profiles]
curl = "registries"
wget = "registries"
ssh = "git_readonly"
scp = "git_readonly"
rsync = "git_readonly"

[command_profiles]
"cargo add" = "registries"
"cargo install" = "registries"
"git ls-remote" = "git_readonly"
"git clone" = "git_readonly"
"git fetch" = "git_readonly"
"go get" = "registries"
"npm ci" = "registries"
"npm install" = "registries"
"pip download" = "registries"
"pnpm install" = "registries"
"uv sync" = "registries"
"pip install" = "registries"
"uv pip install" = "registries"
"yarn install" = "registries"
